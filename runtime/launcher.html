<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The archive to run, relative to this page. sw.js must sit next to it (or in a parent folder). -->
<meta name="zip-bundle" content="app.zip">
<title>Loading…</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --track: #e2e2dd; --bar: #2f6fdf; --error: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --track: #2c2c2a; --bar: #6c9cf0; --error: #f2b8b5; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(420px, calc(100% - 32px)); }
  #status { font-weight: 600; }
  #detail { color: var(--muted); font-size: 13px; min-height: 20px; font-variant-numeric: tabular-nums; }
  .track { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin: 12px 0 8px; }
  .bar { height: 100%; width: 0; background: var(--bar); transition: width .15s; }
  .track[hidden] { display: none; }
  .error #status { color: var(--error); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  iframe.app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  button { margin-top: 12px; font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--muted);
    background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div id="status">Starting…</div>
  <div class="track" hidden><div class="bar"></div></div>
  <div id="detail"></div>
</main>
<script type="module">
const $status = document.getElementById('status');
const $detail = document.getElementById('detail');
const $track = document.querySelector('.track');
const $bar = document.querySelector('.bar');

const zipUrl = new URL(document.querySelector('meta[name="zip-bundle"]').content, location.href).href;

function show(status, detail = '') {
  $status.textContent = status;
  $detail.textContent = detail;
}

function progress(done, total) {
  $track.hidden = false;
  $bar.style.width = total ? `${Math.min(100, done / total * 100)}%` : '0';
  $detail.textContent = total ? `${mb(done)} of ${mb(total)} MB` : `${mb(done)} MB`;
}

const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0);

function call(worker, message) {
  return new Promise((resolve, reject) => {
    const channel = new MessageChannel();
    channel.port1.onmessage = e => e.data.ok ? resolve(e.data.result) : reject(new Error(e.data.error));
    worker.postMessage(message, [channel.port2]);
  });
}

class VersionChanged extends Error {}

// Downloads bytes [0, info.want) of the archive into OPFS, where the service worker reads them.
async function download(info) {
  const headers = {};
  if (!info.rangeless) {
    headers.Range = `bytes=0-${info.want - 1}`;
    if (info.ifRange) headers['If-Range'] = info.ifRange;
  }
  const res = await fetch(zipUrl, { headers, cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status} while downloading ${zipUrl}`);
  if (!info.rangeless && res.status !== 206) throw new VersionChanged();
  const etag = res.headers.get('ETag'), lastModified = res.headers.get('Last-Modified');
  if ((etag && info.etag && etag !== info.etag) ||
      (lastModified && info.lastModified && lastModified !== info.lastModified)) {
    res.body.cancel();
    throw new VersionChanged();
  }

  const total = info.rangeless ? Number(res.headers.get('Content-Length')) || 0 : info.want;
  const root = await navigator.storage.getDirectory();
  const dir = await root.getDirectoryHandle('zipbundle', { create: true });
  const file = await dir.getFileHandle(info.storeKey + '.bin', { create: true });
  const writable = await file.createWritable();
  let done = 0;
  progress(0, total);
  await res.body
    .pipeThrough(new TransformStream({
      transform(chunk, controller) {
        done += chunk.byteLength;
        progress(done, total);
        controller.enqueue(chunk);
      },
    }))
    .pipeTo(writable);
}

async function start() {
  if (!('serviceWorker' in navigator)) throw new Error('This browser does not support service workers.');
  if (!isSecureContext) throw new Error('This page must be opened over HTTPS (or from localhost).');

  show('Starting…');
  await navigator.serviceWorker.register('sw.js', { scope: './' });
  const worker = (await navigator.serviceWorker.ready).active;

  show('Reading archive…');
  let info = await call(worker, { type: 'mount', zip: zipUrl });

  if (info.want > info.have) {
    navigator.storage.persist?.().catch(() => {});
    show(info.mode === 'full' ? 'Downloading…' : 'Preloading…');
    try {
      await download(info);
    } catch (err) {
      if (!(err instanceof VersionChanged)) throw err;
      // A new version was uploaded in the meantime: re-read it and download again.
      info = await call(worker, { type: 'mount', zip: zipUrl });
      await download(info);
    }
    show('Preparing…');
    info = await call(worker, { type: 'prefix-ready', zip: zipUrl });
  }

  if (!info.entry) throw new Error('The archive has no index.html and no entry page configured.');
  // Open index.html by its folder URL, as a web server would: apps often derive their base from it.
  const page = info.entry.replace(/(^|\/)index\.html$/, '$1');
  entryUrl = appRoot + page.split('/').map(encodeURIComponent).join('/');
  // A cross-origin isolated app needs COOP/COEP on the top-level page, which the hosting doesn't send
  // for the launcher, so such apps replace the launcher instead of running in a frame.
  if (info.frame && (!info.isolated || crossOriginIsolated)) runInFrame(appUrlFromLauncher());
  else location.replace(appUrlFromLauncher());
}

// Frame mode: the address bar keeps the launcher's URL, so any link copied from it also works in a
// browser that has never run the launcher. The entry page's query and hash are the launcher's own;
// any other page of the app goes into ?zip-bundle-page=<path in the archive, with its query>.
const appRoot = zipUrl + '/';
const launcherUrl = location.origin + location.pathname;
const PAGE_PARAM = 'zip-bundle-page';
let entryUrl;

function appUrlFromLauncher() {
  const page = new URLSearchParams(location.search).get(PAGE_PARAM);
  return page === null ? entryUrl + location.search + location.hash : appRoot + page + location.hash;
}

function launcherUrlFromApp(href) {
  const url = new URL(href);
  if (!url.href.startsWith(appRoot)) return null;
  if (url.pathname === new URL(entryUrl).pathname) return launcherUrl + url.search + url.hash;
  const page = encodeURIComponent(url.href.slice(appRoot.length, url.href.length - url.hash.length));
  return `${launcherUrl}?${PAGE_PARAM}=${page.replace(/%2F/g, '/')}${url.hash}`;
}

function runInFrame(src) {
  const frame = document.createElement('iframe');
  frame.className = 'app';
  frame.allow = 'fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; screen-wake-lock; '
    + 'camera; microphone; geolocation; midi; encrypted-media; picture-in-picture; web-share; xr-spatial-tracking';
  frame.src = src;
  document.querySelector('main').hidden = true;
  document.body.append(frame);

  const appWindow = () => {
    try { return frame.contentWindow.document && frame.contentWindow; } catch { return null; }  // left the origin
  };
  // App -> address bar. replaceState: the frame's own navigations already create the history entries.
  const toAddressBar = () => {
    const url = appWindow() && launcherUrlFromApp(appWindow().location.href);
    if (url && url !== location.href) history.replaceState(history.state, '', url);
  };
  // Title and icons follow the app's.
  let headSignature = '';
  const copyHead = doc => {
    const icons = [...doc.querySelectorAll('link[rel~="icon" i]')].map(l => [l.rel, l.href, l.type, l.sizes.value]);
    const signature = JSON.stringify([doc.title, icons]);
    if (signature === headSignature) return;
    headSignature = signature;
    if (doc.title) document.title = doc.title;
    document.querySelectorAll('link[data-app-icon]').forEach(l => l.remove());
    for (const [rel, href, type, sizes] of icons) {
      const link = Object.assign(document.createElement('link'), { rel, href, type, sizes });
      link.dataset.appIcon = '';
      document.head.append(link);
    }
  };

  frame.addEventListener('load', () => {
    const win = appWindow();
    if (!win) return;
    toAddressBar();
    copyHead(win.document);
    new MutationObserver(() => copyHead(win.document))
      .observe(win.document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['href', 'rel'] });
    win.navigation?.addEventListener('currententrychange', toAddressBar);
    // Pages outside the archive (other sites, other paths of this one) open in the whole tab.
    win.navigation?.addEventListener('navigate', e => {
      if (!e.cancelable || e.navigationType === 'traverse' || e.downloadRequest !== null || e.formData) return;
      if (e.destination.url.startsWith(appRoot)) return;
      e.preventDefault();
      location.href = e.destination.url;
    });
    win.focus();
  });

  // Address bar -> app: the user edited the hash, or went back between such edits.
  addEventListener('popstate', () => {
    const target = appUrlFromLauncher();
    const win = appWindow();
    if (win && win.location.href !== target) win.location.replace(target);
  });
}

// Deletes the downloaded archives and cached files of all bundles on this site (Cache Storage and
// OPFS; DevTools has no way to browse or clear OPFS on its own) and unregisters the service worker.
async function reset() {
  show('Clearing downloaded data…');
  const before = (await navigator.storage.estimate()).usage || 0;
  const registration = await navigator.serviceWorker?.getRegistration();
  if (registration?.active) {
    // Let the worker drop its open archives first; a broken worker must not block the reset.
    const timeout = new Promise(resolve => setTimeout(resolve, 3000));
    await Promise.race([call(registration.active, { type: 'reset' }), timeout]).catch(() => {});
  }
  for (const name of await caches.keys()) {
    if (name.startsWith('zipbundle:')) await caches.delete(name);
  }
  await (await navigator.storage.getDirectory()).removeEntry('zipbundle', { recursive: true }).catch(() => {});
  await registration?.unregister();
  const after = (await navigator.storage.estimate()).usage || 0;
  show('Downloaded data cleared', `Freed ${mb(Math.max(0, before - after))} MB.`);
  addButton('Start the application', () => location.replace(location.pathname));
}

function addButton(text, onclick) {
  let box = document.querySelector('.buttons');
  if (!box) document.querySelector('main').append(box = Object.assign(document.createElement('div'), { className: 'buttons' }));
  const button = document.createElement('button');
  button.textContent = text;
  button.onclick = onclick;
  box.append(button);
}

const resetRequested = new URLSearchParams(location.search).has('zip-bundle-reset');
(resetRequested ? reset() : start()).catch(err => {
  console.error(err);
  document.body.classList.add('error');
  $track.hidden = true;
  show(resetRequested ? 'Could not clear the data' : 'Could not start the application', err.message);
  addButton('Retry', () => location.reload());
  if (!resetRequested) addButton('Clear downloaded data', () => location.replace(location.pathname + '?zip-bundle-reset'));
});
</script>
</body>
</html>
